services:
  homeassistant:
    labels:
      - traefik.http.routers.homeassistant.rule=Host(`home.spaceduck.cloud`)
      - traefik.http.services.homeassistant.loadbalancer.server.port=8123
      - traefik.http.routers.homeassistant.tls=true
      - traefik.http.routers.homeassistant.tls.certresolver=letsencryptprod
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.8.3"
    volumes:
      - homeassistant_data:/config
    networks:
      - home
      - traefik
    environment:
      - TZ=America/Halifax
    restart: always

  zigbee2mqtt:
    labels:
      - traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee2mqtt.spaceduck.cloud`)
      - traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080
      - traefik.http.routers.zigbee2mqtt.tls=true
      - traefik.http.routers.zigbee2mqtt.tls.certresolver=letsencryptprod
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.0@sha256:c13d177dd7f7f396574ab00926188ad542cfb68c6a5d5f84021bebd9adf6ede9
    restart: always
    volumes:
      - zigbee2mqtt_data:/app/data
    environment:
      - TZ=America/Halifax
      - ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED=true
      - ZIGBEE2MQTT_CONFIG_FRONTEND_URL=https://zigbee2mqtt.spaceduck.cloud
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=tcp://192.168.1.90:6638
      - ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE=115200
      - ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER=ezsp
      - ZIGBEE2MQTT_CONFIG_ADVANCED_TRANSMIT_POWER=20
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://mosquitto:1883
      - ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED=true
    networks:
      - home
      - traefik
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    volumes:
      - mosquitto_data:/mosquitto/data
    networks:
      - home
    configs:
      - source: mosquitto_config
        target: /mosquitto/config/mosquitto.conf
    restart: always

volumes:
  homeassistant_data:
  zigbee2mqtt_data:
  mosquitto_data:
  mosquitto_config:
networks:
  traefik:
    name: traefik_default
    external: true
  home:

configs:
  mosquitto_config:
    content: |
      persistence true
      persistence_location /mosquitto/data/
      log_dest file /mosquitto/log/mosquitto.log
      listener 1883
      allow_anonymous true
